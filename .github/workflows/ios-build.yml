name: iOS device bootstrap build

on:
  workflow_dispatch:
  push:
    branches: [ "ios/assaultcube-port" ]
  pull_request:

jobs:
  bootstrap-arm64:
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install CMake and Ninja
        shell: bash
        run: |
          brew install cmake ninja
          cmake --version
          ninja --version

      - name: Configure device-only ARM64 bootstrap app
        shell: bash
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S ios -B ios/build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build ios/build --config Release --parallel

      - name: Verify app bundle and executable architecture
        shell: bash
        run: |
          APP="ios/build/AssaultCubeIOSBootstrap.app"
          EXECUTABLE="$APP/AssaultCubeIOSBootstrap"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -x "$EXECUTABLE"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          file "$EXECUTABLE"
          lipo -verify_arch arm64 "$EXECUTABLE"
          if otool -L "$EXECUTABLE" | grep -E 'lib(main|SDL2|GL)\.so|libandroid'; then
            echo 'Unexpected Android library dependency found' >&2
            exit 1
          fi

      - name: Package unsigned bootstrap IPA
        shell: bash
        run: |
          rm -rf Payload AssaultCubeIOSBootstrap_unsigned.ipa
          mkdir -p Payload
          ditto ios/build/AssaultCubeIOSBootstrap.app Payload/AssaultCubeIOSBootstrap.app
          zip -qry AssaultCubeIOSBootstrap_unsigned.ipa Payload
          unzip -l AssaultCubeIOSBootstrap_unsigned.ipa | grep 'Payload/AssaultCubeIOSBootstrap.app/Info.plist'

      - name: Upload unsigned bootstrap IPA
        uses: actions/upload-artifact@v4
        with:
          name: assaultcube-ios-bootstrap-unsigned-ipa
          path: AssaultCubeIOSBootstrap_unsigned.ipa
          if-no-files-found: error
